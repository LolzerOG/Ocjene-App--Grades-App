function norm(u){if(!u.Ss){u.Ss=[Array.isArray(u.S)?u.S:[],[]];u.OTs=[u.OT||4.5,4.5];delete u.S;delete u.OT}while(u.Ss.length<2)u.Ss.push([]);if(!u.OTs)u.OTs=[4.5,4.5];u.sem=u.sem===1?1:0}
function loadP(){P.list.forEach(norm);const u=P.list[P.cur];S=u.Ss[u.sem];OT=u.OTs[u.sem]||4.5}
const T={blue:{n:'Plava',dot:'#3b82f6',bg:'#05070d'},pink:{n:'Roza',dot:'#ec4899',bg:'#0d050a'},gray:{n:'Crna',dot:'#9ca3af',bg:'#050505'},green:{n:'Zelena',dot:'#22c55e',bg:'#040b07'},purple:{n:'Ljubičasta',dot:'#8b5cf6',bg:'#08050f'},orange:{n:'Narandžasta',dot:'#f97316',bg:'#0d0702'},red:{n:'Crvena',dot:'#ef4444',bg:'#0d0405'},teal:{n:'Tirkizna',dot:'#14b8a6',bg:'#030b0b'}};
const mean=a=>a.length?a.reduce((x,y)=>x+y,0)/a.length:null;
const f=x=>x===null?'–':x.toFixed(2).replace('.',L==='en'?'.':',');
const word=x=>tr('words')[x>=4.5?4:x>=3.5?3:x>=2.5?2:x>=1.5?1:0];
const esc=s=>String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const nm=(s,i)=>esc(s.n||(tr('subj')+(i+1)));
function goal(s){
 const T=s.ta||4.5,n=s.g.length,sum=s.g.reduce((a,b)=>a+b,0),e=1e-9;
 if(n&&sum/n>=T-e)return tr('g_done')(f(sum/n),f(T));
 if(T>=5-e)return n?tr('g_no5')():tr('g_all5')();
 const g=Math.ceil(T*(n+1)-sum-e);
 if(g<=5)return tr('g_next')(f(T),Math.max(g,1));
 const k=Math.ceil((T*n-sum)/(5-T)-e);
 return tr('g_more')(f(T),k);
}
function overallGoal(){
 const T=OT,e=1e-9;
 const st=[];S.forEach((s,i)=>{if(s.g.length)st.push({i,s:s.g.reduce((a,b)=>a+b,0),n:s.g.length,add:0})});
 if(!st.length)return tr('og_first');
 const cur=o=>(o.s+5*o.add)/(o.n+o.add);
 const ov=()=>st.reduce((a,o)=>a+cur(o),0)/st.length;
 const start=ov();
 if(start>=T-e)return tr('g_done')(f(start),f(T));
 if(T>=5-e)return tr('g_no5')();
 let steps=0;
 while(ov()<T-e&&steps<80){
  let best=null,bg=-1;
  st.forEach(o=>{const gn=(o.s+5*(o.add+1))/(o.n+o.add+1)-cur(o);if(gn>bg){bg=gn;best=o}});
  best.add++;steps++;
 }
 if(ov()<T-e)return tr('og_far')(f(T));
 const li=st.filter(o=>o.add>0).sort((a,b)=>b.add-a.add).map(o=>{
  const now=o.s/o.n,nx=cur(o);
  return tr('og_li')(o.add,nm(S[o.i],o.i),f(now),f(nx))}).join('');
 return tr('og_sum')(f(start),f(T),li);
}
function render(){
 document.getElementById('list').innerHTML=S.map((s,i)=>{
  const on=open===i,a=mean(s.g);
  return `<div class="sub ${on?'on':''}" onclick="cl(${i})"><div class="row">
   <span class="no">${i+1}.</span>
   <input value="${esc(s.n)}" placeholder="${tr('ph')}" readonly onpointerdown="ps(this)" onpointerup="pe()" onpointerleave="pe()" onpointercancel="pe()" oncontextmenu="return !this.readOnly" onkeydown="if(event.key==='Enter')this.blur()" onblur="this.readOnly=true" onchange="S[${i}].n=this.value;save();renderBar()">
   ${on?'':`<div class="mini">${s.g.map(g=>`<i class="m g${g}">${g}</i>`).join('')}</div>`}
   <div class="avg">${f(a)}</div></div>
   ${on?`<div class="panel" onclick="event.stopPropagation()"><div class="chips">${s.g.map((g,j)=>`<button class="chip g${g}" onclick="rm(${i},${j})">${g}</button>`).join('')}</div>
   <div class="lbl">${tr('addg')}</div>
   <div class="btns add">${[1,2,3,4,5].map(g=>`<button onclick="addG(${i},${g})">${g}</button>`).join('')}</div>
   <div class="lbl">${tr('target')}<b class="sv" id="sv">${f(s.ta||4.5)}</b></div>
   <input class="sl" type="range" min="2" max="5" step="0.1" value="${s.ta||4.5}" oninput="sl(${i},this.value)">
   <div class="goal" id="gs">${goal(s)}</div>
   <div class="foot"><span class="hint">${tr('tapdel')}</span><button class="del" onclick="delSub(${i})">${tr('delsub')}</button></div></div>`:''}
  </div>`}).join('');
 renderBar();
}
function applyLang(){document.title=tr('title');document.documentElement.lang=L;
 const set=(id,v)=>{const e=document.getElementById(id);if(e)e.textContent=v};
 set('tip',tr('tip'));set('addsub',tr('addsub'));const g=document.getElementById('gear');if(g)g.setAttribute('aria-label',tr('settings'))}
function renderBar(){applyLang();applyTheme();renderMenu();renderSet();
 const av=S.map(s=>mean(s.g)).filter(x=>x!==null),t=mean(av);
 document.getElementById('w').textContent=t===null?tr('nogr'):word(t);
 document.getElementById('n').textContent=t===null?'':f(t);
 document.getElementById('cnt').textContent=tr('cnt')(S.length);
 document.getElementById('who').textContent=P.list[P.cur].n+' ▾';
 const u=P.list[P.cur];
 document.getElementById('seg').innerHTML=[0,1].map(k=>`<button class="${k===u.sem?'sel':''}" onclick="setSem(${k})">${tr('sem')(k)}</button>`).join('');
 document.getElementById('bl').textContent=tr('barl')(u.sem);
 const sh=document.getElementById('sheet');
 sh.className='sheet'+(sheet?' show':'');
 if(sheet)sh.innerHTML=`<div class="lbl">${tr('otarget')}<b class="sv" id="ov">${f(OT)}</b></div>
  <input class="sl" type="range" min="2" max="5" step="0.1" value="${OT}" oninput="slO(this.value)">
  <div class="goal" id="go">${overallGoal()}</div>`;
}
function tg(i){hp('i','LIGHT');open=open===i?-1:i;if(open>=0){sheet=false;menu=false;setOpen=false}render()}
let tm=0,skip=0;
function ps(el){clearTimeout(tm);tm=setTimeout(()=>{skip=Date.now()+800;hp('i','MEDIUM');el.readOnly=false;el.focus();el.select()},500)}
function pe(){clearTimeout(tm)}
function cl(i){if(Date.now()<skip)return;const a=document.activeElement;if(a&&a.tagName==='INPUT'&&!a.readOnly)return;tg(i)}
function tgSheet(){hp('i','LIGHT');sheet=!sheet;if(sheet){open=-1;menu=false;setOpen=false}render()}
function setSem(k){const u=P.list[P.cur];if(u.sem===k)return;hp('i','LIGHT');save();u.sem=k;if(!u.Ss[k].length&&u.Ss[1-k].length)u.Ss[k]=u.Ss[1-k].map(s=>({n:s.n,g:[]}));loadP();save();open=-1;sheet=false;render()}
function tgSet(){hp('i','LIGHT');if(document.activeElement&&document.activeElement.blur)document.activeElement.blur();setOpen=!setOpen;if(setOpen){open=-1;sheet=false;menu=false}render()}
const IC={
 vib:'<svg viewBox="0 0 24 24"><rect x="8" y="4" width="8" height="16" rx="2"/><path d="M4 8v8M20 8v8"/></svg>',
 az:'<svg viewBox="0 0 24 24"><path d="M4 6h16M4 12h11M4 18h6"/></svg>',
 up:'<svg viewBox="0 0 24 24"><path d="M12 15V4M8 8l4-4 4 4M5 15v4h14v-4"/></svg>',
 down:'<svg viewBox="0 0 24 24"><path d="M12 4v11M8 11l4 4 4-4M5 19h14"/></svg>',
 chev:'<svg viewBox="0 0 24 24"><path d="M9 6l6 6-6 6"/></svg>',
 x:'<svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></svg>',
 globe:'<svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3c3 3.5 3 14.5 0 18M12 3c-3 3.5-3 14.5 0 18"/></svg>'};
function renderSet(){
 const m=document.getElementById('set');m.className='sheet top'+(setOpen?' show':'');
 if(!setOpen)return;
 m.innerHTML=`<div class="sh"><b>${tr('settings')}</b><button class="x" onclick="tgSet()" aria-label="${tr('close')}">${IC.x}</button></div>
 <div class="lbl">${tr('general')}</div>
 <div class="grp">
  <button class="it" id="hapb" role="switch" aria-checked="${HAP}" onclick="tgHap()"><span class="ic">${IC.vib}</span><span class="tx">${tr('vib')}<small id="haps">${HAP?tr('on'):tr('off')}</small></span><span class="tgl${HAP?' on':''}" id="hapt"></span></button>
  <button class="it" onclick="tgLang()"><span class="ic">${IC.globe}</span><span class="tx">${tr('lang')}<small>${tr('langname')}</small></span><span class="lg"><b class="${L==='bs'?'on':''}">BS</b><b class="${L==='en'?'on':''}">EN</b></span></button>
  <button class="it" onclick="sortAZ()"><span class="ic">${IC.az}</span><span class="tx">${tr('sort')}<small>${tr('sortd')}</small></span><span class="chev">${IC.chev}</span></button>
 </div>
 <div class="lbl">${tr('bkup')}</div>
 <textarea id="bk" class="bk" onfocus="setTimeout(()=>this.scrollIntoView({block:'nearest',behavior:'smooth'}),300)" placeholder="${tr('bkph')}"></textarea>
 <div class="bkb"><button onclick="expD()">${IC.up}${tr('exp')}</button><button onclick="impD()">${IC.down}${tr('imp')}</button></div>
 <div class="hint" id="bm" style="margin-top:8px"></div>`;
}
function setLang(l){if(l===L)return;hp('i','LIGHT');const a=TX[L],b=TX[l];
 const cv=n=>n===a.prof?b.prof:n===a.subj0?b.subj0:n;
 P.list.forEach(u=>{u.n=cv(u.n);(u.Ss||[]).forEach(arr=>arr.forEach(x=>{x.n=cv(x.n)}))});
 L=l;ST.set('ocjeneLang',l);save();render()}
function tgLang(){setLang(L==='bs'?'en':'bs')}
function bmsg(x){const e=document.getElementById('bm');if(e)e.textContent=x}
function sortAZ(){hp('i','LIGHT');S.sort((a,b)=>(!a.n&&b.n)?1:(a.n&&!b.n)?-1:(a.n||'').localeCompare(b.n||'',L==='en'?'en':'bs'));open=-1;setOpen=false;save();render()}
function expD(){const s=JSON.stringify(P),ta=document.getElementById('bk');ta.value=s;ta.scrollTop=0;hp('n','SUCCESS');
 const man=()=>{ta.focus();ta.select();bmsg(tr('manual'))};
 try{navigator.clipboard.writeText(s).then(()=>bmsg(tr('copied')),man)}catch(e){man()}}
function impD(){const ta=document.getElementById('bk');let o;if(document.activeElement&&document.activeElement.blur)document.activeElement.blur();
 try{o=JSON.parse(ta.value)}catch(e){hp('n','ERROR');bmsg(tr('invalid'));return}
 if(!o||!Array.isArray(o.list)||!o.list.length||!o.list.every(u=>u&&typeof u.n==='string')){hp('n','ERROR');bmsg(tr('invalid'));return}
 if(!confirm(tr('confirmImp')))return;
 P=o;if(!P.list[P.cur])P.cur=0;loadP();hp('n','SUCCESS');open=-1;setOpen=false;save();render()}
function applyTheme(){const c=P.list[P.cur].c;document.documentElement.setAttribute('data-theme',c);const m=document.querySelector('meta[name=theme-color]');if(m)m.content=(T[c]||T.blue).bg;try{const SB=CP.StatusBar,col=(T[c]||T.blue).bg;if(SB&&applyTheme.l!==col){applyTheme.l=col;SB.setBackgroundColor({color:col});SB.setStyle({style:'DARK'})}}catch(e){}}
function renderMenu(){
 const m=document.getElementById('menu');m.className='sheet top'+(menu?' show':'');
 if(!menu)return;
 const c=P.list[P.cur];
 m.innerHTML=`<div class="lbl">${tr('users')}</div>`+P.list.map((u,i)=>`<button class="usr ${i===P.cur?'cur':''}" onclick="sw(${i})"><i class="dot" style="background:${(T[u.c]||T.blue).dot}"></i>${esc(u.n)}${i===P.cur?' ✓':''}</button>`).join('')+
 `<div class="lbl" style="margin-top:10px">${esc(tr('themeFor')(c.n))}<b style="color:var(--ac2);text-transform:none;letter-spacing:0">${tn(c.c)}</b></div>
  <div class="sw">${Object.keys(T).map(k=>`<button class="swb ${c.c===k?'on':''}" style="background:${T[k].dot}" onclick="setC('${k}')" aria-label="${tn(k)}"></button>`).join('')}</div>
  <div class="foot"><button class="del" style="color:var(--ac2)" onclick="newU()">${tr('newu')}</button><span><button class="del" style="color:var(--ac2)" onclick="renU()">${tr('ren')}</button>${P.list.length>1?` <button class="del" onclick="delU()">${tr('del')}</button>`:''}</span></div>`;
}
function tgMenu(){hp('i','LIGHT');menu=!menu;if(menu){open=-1;sheet=false;setOpen=false}render()}
function sw(i){hp('i','LIGHT');P.cur=i;loadP();open=-1;sheet=false;menu=false;save();render()}
function setC(c){hp('i','LIGHT');P.list[P.cur].c=c;save();render()}
function newU(){const n=(prompt(tr('pNew'))||'').trim();if(!n)return;const c=P.list[P.cur].c==='blue'?'pink':'blue';P.list.push({n,c,sem:0,Ss:[[],[]],OTs:[4.5,4.5]});sw(P.list.length-1)}
function renU(){const n=(prompt(tr('pRen'),P.list[P.cur].n)||'').trim();if(!n)return;P.list[P.cur].n=n;save();render()}
function delU(){if(P.list.length>1&&confirm(tr('cDelU')(P.list[P.cur].n))){hp('n','WARNING');P.list.splice(P.cur,1);P.cur=0;loadP();open=-1;menu=false;save();render()}}
function slO(v){hps();OT=+v;save();document.getElementById('ov').textContent=f(OT);document.getElementById('go').innerHTML=overallGoal()}
function addG(i,g){S[i].g.push(g);if(g===5)hp('n','SUCCESS');else if(g===1)hp('n','WARNING');else hp('i','LIGHT');save();render()}
function rm(i,j){hp('i','MEDIUM');S[i].g.splice(j,1);save();render()}
function sl(i,v){hps();S[i].ta=+v;save();document.getElementById('sv').textContent=f(+v);document.getElementById('gs').innerHTML=goal(S[i])}
function addSub(){hp('i','LIGHT');S.push({n:'',g:[]});open=S.length-1;sheet=false;menu=false;setOpen=false;save();render();const x=document.querySelectorAll('.row input');x[x.length-1].readOnly=false;x[x.length-1].focus();x[x.length-1].scrollIntoView({block:'center'})}
function delSub(i){if(confirm(tr('cDelS'))){hp('n','WARNING');S.splice(i,1);open=-1;save();render()}}
async function boot(){
 try{const h=await ST.get('ocjeneHap');HAP=h!=='0'}catch(e){}
 try{L=(await ST.get('ocjeneLang'))==='en'?'en':'bs'}catch(e){}
 try{P=JSON.parse((await ST.get('ocjeneP'))||'null')}catch(e){}
 if(!P||!P.list||!P.list.length){
  let old=[],ot=4.5;
  try{old=JSON.parse(localStorage.getItem('ocjene2')||localStorage.getItem('ocjene')||'[]');ot=+localStorage.getItem('ocjeneOTa')||4.5}catch(e){}
  if(!old.length)old=[{n:tr('subj0'),g:[]}];
  P={cur:0,list:[{n:tr('prof'),c:'blue',S:old,OT:ot}]};
 }
 if(!P.list[P.cur])P.cur=0;
 loadP();render();
}
const isTxt=t=>t&&(t.tagName==='TEXTAREA'||(t.tagName==='INPUT'&&t.type!=='range'&&!t.readOnly));
document.addEventListener('focusin',e=>{if(isTxt(e.target))document.body.classList.add('kb')});
document.addEventListener('focusout',()=>setTimeout(()=>{if(!isTxt(document.activeElement))document.body.classList.remove('kb')},60));
const vv=window.visualViewport,vvSync=()=>document.documentElement.style.setProperty('--vvh',(vv?vv.height:innerHeight)+'px');
if(vv)vv.addEventListener('resize',vvSync);addEventListener('resize',vvSync);vvSync();
boot();
try{const A=CP.App;if(A&&A.addListener)A.addListener('backButton',()=>{
 if(sheet||menu||setOpen||open>=0){sheet=menu=setOpen=false;open=-1;hp('i','LIGHT');render()}
 else if(A.exitApp)A.exitApp()})}catch(e){}
</script></body></html>
